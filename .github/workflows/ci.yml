# The first CI this repo has had.
#
# Five consecutive Build Log entries asked for it: "still no CI", "nothing runs
# the parser tests or the web tests on a push", "four sessions of added tests
# and nothing checks them". `main` also takes direct merges, which makes the
# gap sharper rather than softer.
#
# What it CANNOT check, stated here so nobody reads a green tick as more than
# it is: the golden .ibt fixtures are not in the repo (they are ~60-136 MB each
# and live in OneDrive on the rig), so the six golden tests SKIP here. The
# regression tripwire in CLAUDE.md — brake ceiling 89.8%, 69 noise spikes,
# -50 ms release-to-brake, 0.213 s over 31 L — is still only checkable on a
# machine that has those files. CI proves the code runs and the synthetic
# ground truth is recovered. It does not prove the numbers on real telemetry.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: parser (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # pyproject requires >=3.11
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - name: Install
        working-directory: parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        working-directory: parser
        # -rs lists the skipped golden fixtures by name, so the log says which
        # checks did NOT run rather than quietly passing without them.
        run: python -m pytest tests -q -rs

  web:
    name: web (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Test
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        # No DATABASE_URL: lib/db.ts creates the neon client lazily and every
        # route is force-dynamic, so a build never opens a connection. If this
        # step ever fails for want of a database, that laziness has regressed.
        run: npx next build

  render-service:
    name: render-service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: render-service/requirements.txt
      - name: Install
        working-directory: render-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e ../parser
      - name: Test
        working-directory: render-service
        run: python -m pytest tests -q
