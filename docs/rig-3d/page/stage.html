<div class="stage" id="stage" data-state="loading" data-view="orbit">
              <img class="poster" alt="" src="{{POSTER}}">
              <canvas id="rigCanvas" role="img" aria-label="3D view of the sim rig and its seven mounting slots"></canvas>
              <div class="stage-overlay" id="stageOverlay">
                <div class="ring3d" id="ring3d"></div>
                <button class="plus3d hidden" id="plus3d" type="button" aria-label="Add a component to the empty slot">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>
                </button>
              </div>
              <div class="stage-hud">
                <div class="seg" id="viewSeg" role="group" aria-label="Camera">
                  <button class="seg-opt" data-active="true" data-view="orbit" type="button">Orbit</button>
                  <button class="seg-opt" data-active="false" data-view="seat" type="button">Driver's seat</button>
                </div>
              </div>
              <span class="stage-msg eyebrow" id="stageMsg">loading the model</span>
            </div>
