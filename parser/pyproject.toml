[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proctor-parser"
version = "0.1.0"
description = "iRacing .ibt telemetry parser: bytes in, lap objects out"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "PyYAML>=6.0"]

[tool.setuptools]
packages = ["proctor_parser", "proctor_parser.analysis"]
